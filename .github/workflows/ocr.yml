name: Full Book OCR - Free No API

on:
  workflow_dispatch:
  push:
    paths:
      - '*.pdf'
      - 'ocr.py'

jobs:
  ocr-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Full Book OCR
        run: |
          python ocr.py

      - name: Show Output
        run: |
          ls -lh
          head -n 100 full_book_text.txt

      - name: Upload Final Text File
        uses: actions/upload-artifact@v4
        with:
          name: full-book-text-result
          path: full_book_text.txt
